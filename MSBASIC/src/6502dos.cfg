# 6502DOS target: ROM bank 2 of the 6502DOS ROM, $C000-$FFFF, 16 KB.
# The IRQ entry at $FFA0 and the vectors at $FFFA match banks 0 and 1
# (src/asm/rom.cfg in the 6502DOS repo).
MEMORY {
	ZP:		start = $0022, size = $005E, type = rw, file = "";
	DATA8:		start = $0810, size = $0050, type = rw, file = "";
	HIRAM:		start = $9C00, size = $0300, type = rw, file = "";
	BANK2:		start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O;
	DUMMY:		start = $0000, size = $00FF, file = "";
}

SEGMENTS {
	ZEROPAGE:	load = ZP, type = zp;
	DOSDATA:	load = DATA8, type = bss;
	IORAM:		load = HIRAM, type = bss, define = yes; # BASIC's RAM ends below it
	HEADER:		load = BANK2, type = ro;
	VECTORS:	load = BANK2, type = ro;
	KEYWORDS:	load = BANK2, type = ro;
	ERROR:		load = BANK2, type = ro;
	CODE:		load = BANK2, type = ro;
	CHRGET:		load = BANK2, type = ro;
	INIT:		load = BANK2, type = ro;
	EXTRA:		load = BANK2, type = ro;
	FARIRQ2:	load = BANK2, type = ro, start = $FFA0;
	CPUVECTORS:	load = BANK2, type = ro, start = $FFFA;
	DUMMY:		load = DUMMY; # don't include
}

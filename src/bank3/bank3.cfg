# ld65 config for ROM bank 3 of the 6502DOS ROM, $C000-$FFFF, 16 KB. tools/build.py appends it
# to build/6502DOS.ROM after bank 2.
MEMORY {
    BANK3:   start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    CODE:    load = BANK3, type = ro;
    FARIRQ3: load = BANK3, type = ro, start = $FFA0;
    VECTORS: load = BANK3, type = ro, start = $FFFA;
}

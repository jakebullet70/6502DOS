# ld65 config for ROM bank 3 or 4 of the 6502DOS ROM, $C000-$FFFF, 16 KB. tools/build.py
# appends bank 3, then bank 4, to build/6502DOS.ROM after bank 2.
MEMORY {
    BANK:    start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    CODE:    load = BANK, type = ro;
    FARIRQ:  load = BANK, type = ro, start = $FFA0;
    VECTORS: load = BANK, type = ro, start = $FFFA;
}

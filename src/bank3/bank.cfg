# ld65 config for one bank of a UXCBASIC program in the 6502DOS ROM, $C000-$FFFF, 16 KB:
# banks 3 and 4, or 6 and 7. tools/build.py appends each to build/6502DOS.ROM in bank order.
MEMORY {
    BANK:    start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O;
}

SEGMENTS {
    CODE:    load = BANK, type = ro;
    FARIRQ:  load = BANK, type = ro, start = $FFA0;
    VECTORS: load = BANK, type = ro, start = $FFFA;
}

# ld65 config for the UXDOS16 ROM image: ROM bank 0, $C000-$FFFF.

MEMORY {
    KZP:     start = $80, size = $80, type = rw, file = "";
    GATERAM: start = $0310, size = $30, type = rw, file = "";
    KRAM:    start = $0600, size = $F8, type = rw, file = "";
    BANK0:   start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O, bank = 0;
}

SEGMENTS {
    KERNELZP:    load = KZP, type = zp;
    KERNELRAM:   load = KRAM, type = bss;
    CODE:        load = BANK0, type = ro;
    RODATA:      load = BANK0, type = ro;
    GATE:        load = BANK0, run = GATERAM, type = rw, define = yes;
    KERNALJUMPS: load = BANK0, type = ro, start = $FFCF;
    SIGNATURE:   load = BANK0, type = ro, start = $FFF6;
    VECTORS:     load = BANK0, type = ro, start = $FFFA;
}

# ld65 config for the 6502DOS ROM image: ROM banks 0, 1 and 5, each $C000-$FFFF, in that order.
# tools/build.py moves bank 5 after banks 2 to 4.

MEMORY {
    KZP:     start = $80, size = $80, type = rw, file = "";
    GATERAM: start = $0310, size = $30, type = rw, file = "";
    REGMEM:  start = $0400, size = $0200, type = rw, file = "";
    KRAM:    start = $0600, size = $F8, type = rw, file = "";
    FATRAM:  start = $A100, size = $0700, type = rw, file = "";
    FATBUFRAM: start = $A900, size = $0200, type = rw, file = "";
    BANK0:   start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O, bank = 0;
    BANK1:   start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O, bank = 1;
    BANK5:   start = $C000, size = $4000, fill = yes, fillval = $FF, file = %O, bank = 5;
}

SEGMENTS {
    KERNELZP:    load = KZP, type = zp;
    KERNELRAM:   load = KRAM, type = bss;
    REGRAM:      load = REGMEM, type = bss;
    FATBUF:      load = FATBUFRAM, type = bss;
    FATBSS:      load = FATRAM, type = bss;
    CODE:        load = BANK0, type = ro;
    RODATA:      load = BANK0, type = ro;
    GATE:        load = BANK0, run = GATERAM, type = rw, define = yes;
    FARIRQ0:     load = BANK0, type = ro, start = $FFA0;
    KERNALJUMPS: load = BANK0, type = ro, start = $FFCF;
    SIGNATURE:   load = BANK0, type = ro, start = $FFF6;
    VECTORS:     load = BANK0, type = ro, start = $FFFA;
    B1JUMPS:     load = BANK1, type = ro, start = $C000;
    B1CODE:      load = BANK1, type = ro;
    FARIRQ1:     load = BANK1, type = ro, start = $FFA0;
    B1VECTORS:   load = BANK1, type = ro, start = $FFFA;
    B5CODE:      load = BANK5, type = ro;
    FARIRQ5:     load = BANK5, type = ro, start = $FFA0;
    B5VECTORS:   load = BANK5, type = ro, start = $FFFA;
}
